<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City Map Search</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: sans-serif;
      }
      #map {
        height: 100%;
        width: 100%;
      }

      #searchForm {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        align-items: center;
        background: #fff;
        border-radius: 8px;
        padding: 6px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      #inputWrap {
        position: relative;
      }
      #cityInput {
        width: 220px;
        padding: 8px 30px 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }
      /* Hide the browser's native X so only ours shows */
      #cityInput::-webkit-search-cancel-button {
        display: none;
      }
      #clearBtn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        font-size: 18px;
        cursor: pointer;
        color: #888;
        display: none;
      }
      #searchBtn {
        margin-left: 6px;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #2b7cff;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form id="searchForm">
      <div id="inputWrap">
        <input
          type="search"
          id="cityInput"
          placeholder="Search a city"
          autocomplete="off"
        />
        <button type="button" id="clearBtn" aria-label="Clear search">
          &times;
        </button>
      </div>
      <button type="submit" id="searchBtn">Search</button>
    </form>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
